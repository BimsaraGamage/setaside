  <circle cx="256" cy="206" r="40" fill="#0f766e"/>
  <circle cx="256" cy="206" r="28" fill="#fff"/>
  <rect x="120" y="228" width="272" height="20" rx="10" fill="#0f766e"/>
  <rect x="120" y="248" width="272" height="132" rx="30" fill="#fff"/>
</svg>
