name: Release

# On every push to main, release-please keeps the Release PR up to date.
# Merging the Release PR tags a release and, in this same run, deploys it (spec 17, 18).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A short-lived token from the release GitHub App, so CI runs on the Release PR.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  part-1:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/part-1.yml

  deploy:
    name: Deploy ${{ needs.release-please.outputs.tag_name }}
    needs: [release-please, part-1]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # At going public the token moves into this environment (spec 18).
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record the D1 Time Travel bookmark (restore point)
        run: npx wrangler d1 time-travel info setaside
      - name: Apply migrations to the live database
        # A failure stops here: the old app keeps running. Fix forward in a new release.
        run: npx wrangler d1 migrations apply DB --remote
      - name: Build
        run: npx vite build
      - name: No demo sign-in in the live build
        run: node scripts/check-no-demo-sign-in.mjs
      - name: Deploy
        run: npx wrangler deploy
